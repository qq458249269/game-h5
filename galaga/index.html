<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>小蜜蜂 · GALAGA</title>
<style>
html,body{margin:0;background:#000;color:#fff;font-family:monospace;height:100%;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none}
#box{text-align:center}
canvas{border:2px solid #26c;background:#000;touch-action:none}
#hud{font-size:14px;color:#6cf;margin:6px 0}
#msg{font-size:15px;color:#fc0;height:20px}
#tip{font-size:11px;color:#556;margin-top:6px}
button{background:#26c;border:0;color:#fff;font-family:monospace;padding:6px 16px;cursor:pointer;margin-top:4px}
</style>
</head>
<body>
<div id="box">
  <div id="hud">SCORE <span id="sc">0</span>　STAGE <span id="st">1</span>　♥♥ <span id="lf">3</span>　HI <span id="hi">0</span></div>
  <canvas id="cv" width="420" height="480"></canvas>
  <div id="msg">按 开始 或 Enter</div>
  <button id="btn">开始 (Enter)</button>
  <div id="tip">← → 移动 · 空格 射击 · 被捕获后消灭蓝蜂可救回 → 双战机！</div>
</div>
<script>
'use strict';
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
const scEl=document.getElementById('sc'),stEl=document.getElementById('st'),lfEl=document.getElementById('lf'),hiEl=document.getElementById('hi'),msgEl=document.getElementById('msg'),btn=document.getElementById('btn');
const W=420,H=480;
let hi=+(localStorage.getItem('ga_hi')||0);
hiEl.textContent=hi;
let actx=null;
function beep(f,d,type,vol){
  try{
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.connect(g);g.connect(actx.destination);
    o.type=type||'square';o.frequency.value=f;
    g.gain.value=vol||0.035;
    o.start();o.stop(actx.currentTime+d);
  }catch(e){}
}
let ship,shots,enemies,frame,score,lives,stage,state,keys,spawnQ,wave2,tractor;
function reset(){
  ship={x:W/2,captured:null,dual:false};
  shots=[];frame=0;score=0;lives=3;stage=1;
  spawnQ=[];wave2=false;tractor=null;
  keys={};
  mkStage();
  state='play';upd();
  msgEl.textContent='';
}
function upd(){scEl.textContent=score;stEl.textContent=stage;lfEl.textContent=lives}
function mkStage(){
  enemies=[];
  // 编队入场：逐个排入网格
  const cols=8,rows=4;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const t=r===0?0:(r===1?1:2); // 0 boss, 1 中型红, 2 小蜂
    enemies.push({
      home:{x:60+c*40,y:70+r*36},
      x:-60-Math.random()*300,y:-40-Math.random()*260,
      t,hp:t===0?2:1,d:1,
      state:'enter',wait:0,
      dive:0,phase:Math.random()*6.28
    });
  }
  wave2=true;
}
function nextStage(){
  stage++;upd();
  msgEl.textContent='STAGE '+stage;
  mkStage();
}
function gameOver(){
  state='over';
  msgEl.textContent='GAME OVER';
  if(score>hi){hi=score;localStorage.setItem('ga_hi',hi);hiEl.textContent=hi}
  btn.textContent='再来一局 (Enter)';
}
function respawnShip(){
  // 敌人清完再复活的简化：直接居中复活并短暂无敌
  ship.x=W/2;ship.captured=null;ship.dual=false;
  invT=120;
}
let invT=0;
function update(){
  frame++;
  if(invT>0)invT--;
  // 玩家
  if(!ship.captured){
    if(keys.ArrowLeft)ship.x-=3;
    if(keys.ArrowRight)ship.x+=3;
    ship.x=Math.max(16,Math.min(W-16,ship.x));
  }
  if(keys.Space&&frame%14===0&&shots.length<(ship.dual?4:2)&&!ship.captured){
    if(ship.dual){shots.push({x:ship.x-10,y:430},{x:ship.x+10,y:430})}
    else shots.push({x:ship.x,y:430});
    beep(1000,0.05,'square',0.025);
  }
  for(const s of shots)s.y-=7;
  shots=shots.filter(s=>s.y>-10);
  // 敌人状态机
  const alive=enemies.filter(e=>e.state!=='dead');
  for(const e of alive){
    if(e.state==='enter'){
      // 向编队位飞
      const dx=e.home.x-e.x,dy=e.home.y-e.y,L=Math.hypot(dx,dy);
      if(L<4){e.x=e.home.x;e.y=e.home.y;e.state='grid';e.wait=60+Math.random()*240}
      else{e.x+=dx/L*3;e.y+=dy/L*3}
    }else if(e.state==='grid'){
      e.x=e.home.x+Math.sin(frame*0.02+e.home.y*0.05)*6;
      e.y=e.home.y;
      e.wait--;
      if(e.wait<=0&&Math.random()<0.012){e.state='dive';e.t0=frame}
    }else if(e.state==='dive'){
      // 俯冲：正弦横摆+向下
      e.y+=2.6+stage*0.15;
      e.x+=Math.sin((frame-e.t0)*0.06)*2.4;
      // 开火
      if(frame%40===0&&Math.random()<0.3&&e.y<400){
        enemies.push({x:e.x,y:e.y,bomb:true,vx:Math.sin(ship.x*0.05)*0.5,vy:3.2});
      }
      if(e.y>H+30){
        // 从顶部重新入场回编队
        e.y=-30;e.x=e.home.x;e.state='enter';
      }
    }
    // 撞玩家
    if(!ship.captured&&Math.hypot(e.x-ship.x,e.y-440)<18&&!e.bomb){
      killPlayer();
      if(e.state!=='dead'){e.state='dead'}
    }
  }
  // 敌弹
  for(const b of enemies.filter(e=>e.bomb))b.y+=b.vy;
  for(const b of enemies.filter(e=>e.bomb)){
    if(!ship.captured&&Math.abs(b.x-ship.x)<12&&b.y>428&&b.y<452){
      b.y=H+100;killPlayer();
    }
  }
  enemies=enemies.filter(e=>!(e.bomb&&e.y>H+10));
  // 子弹打敌人
  for(const s of shots){
    for(const e of enemies){
      if(e.bomb||e.state==='dead')continue;
      if(Math.abs(s.x-e.x)<15&&Math.abs(s.y-e.y)<13){
        s.y=-100;
        e.hp--;
        if(e.hp<=0){
          e.state='dead';
          score+=e.t===0?150:e.t===1?80:50;
          beep(300,0.12,'sawtooth',0.05);
          // 被捕获战机营救：击中抓走玩家的boss
          if(tractor&&tractor.state==='dead'&&e.t===0&&e.carry){
            tractor=null;
            respawnDual();
          }
        }else beep(200,0.05);
        break;
      }
    }
  }
  enemies=enemies.filter(e=>e.state!=='dead');
  // 捕获事件：boss 拖网抓玩家
  if(!ship.captured&&!ship.dual&&tractor===null){
    const boss=enemies.find(e=>e.t===0&&e.state==='dive');
    if(boss&&Math.hypot(boss.x-ship.x,boss.y-440)<20&&lives>1){
      ship.captured=true;
      tractor=boss;boss.carry=true;
      msgEl.textContent='战机被捕获! 打倒那只蓝蜂救回来!';
      beep(400,0.5,'sine',0.06);
    }
  }
  if(tractor&&tractor.state==='dive'){
    tractor.y+=1.5;
    if(tractor.y>H+40){tractor.state='grid';tractor.y=-40;tractor.x=tractor.home.x}
  }
  if(tractor&&tractor.state!=='dive'&&tractor.state!=='dead'){
    // boss 背着玩家回编队
    // 简化：玩家标记为被俘（画在boss上方）
  }
  if(ship.captured&&tractor&&tractor.state==='grid'){
    // 玩家被绑在编队上方
  }
  // 波清空
  if(!enemies.some(e=>!e.bomb)){
    if(ship.captured){
      // 玩家永久损失
      lives--;upd();ship.captured=false;tractor=null;respawnShip();
      if(lives<=0){gameOver();return}
    }
    nextStage();
  }
}
function killPlayer(){
  if(invT>0)return;
  beep(100,0.4,'sawtooth',0.08);
  lives--;upd();
  if(lives<=0){gameOver();return}
  if(tractor){tractor.carry=false;tractor=null}
  ship.captured=false;ship.dual=false;
  respawnShip();
  msgEl.textContent='剩余 '+lives+' 机';
}
function respawnDual(){
  ship.dual=true;ship.captured=false;
  msgEl.textContent='双战机! FIRE ×2!';
  beep(1200,0.3,'sine',0.06);
}
function drawShip(X,Y,col,wing){
  cx.fillStyle=col;
  cx.fillRect(X-3,Y-12,6,16);
  cx.fillRect(X-12,Y-4,24,8);
  cx.fillStyle=wing||'#fff';
  cx.fillRect(X-12,Y-8,4,4);cx.fillRect(X+8,Y-8,4,4);
}
function draw(){
  cx.fillStyle='#000';cx.fillRect(0,0,W,H);
  // 星空
  for(let i=0;i<40;i++){
    const tw=(frame*0.5+i*37)%H;
    cx.fillStyle=i%3?'#135':'#246';
    cx.fillRect((i*89)%W,tw,2,2);
  }
  // 敌人
  for(const e of enemies){
    if(e.bomb){
      cx.fillStyle='#f80';cx.fillRect(e.x-2,e.y,4,7);continue;
    }
    const fl=Math.sin(frame*0.15+e.phase)>0;
    if(e.t===0){ // boss 蓝蜂
      cx.fillStyle='#4cf';
      cx.fillRect(e.x-14,e.y-8,28,10);
      cx.fillRect(e.x-8,e.y+2,16,6);
      cx.fillStyle='#f6c';
      cx.fillRect(e.x-16,e.y-6+(fl?2:0),5,8);
      cx.fillRect(e.x+11,e.y-6+(fl?2:0),5,8);
      if(e.carry){drawShip(e.x,e.y-18,'#4cf')}
    }else if(e.t===1){ // 红蜂
      cx.fillStyle='#f44';
      cx.fillRect(e.x-9,e.y-6,18,8);
      cx.fillRect(e.x-4,e.y+2,8,5);
      cx.fillStyle='#fa0';
      cx.fillRect(e.x-13,e.y-4+(fl?3:0),4,7);
      cx.fillRect(e.x+9,e.y-4+(fl?3:0),4,7);
    }else{ // 小蜂
      cx.fillStyle='#fd0';
      cx.fillRect(e.x-7,e.y-5,14,7);
      cx.fillStyle='#fff';
      cx.fillRect(e.x-2,e.y+2,4,4);
      cx.fillStyle='#fd0';
      cx.fillRect(e.x-11,e.y-3+(fl?3:0),4,6);
      cx.fillRect(e.x+7,e.y-3+(fl?3:0),4,6);
    }
  }
  // 玩家
  if(!ship.captured){
    if(ship.dual){
      drawShip(ship.x-12,440,'#6cf');drawShip(ship.x+12,440,'#6cf');
    }else{
      drawShip(ship.x,440,invT>0&&invT%10<5?'#333':'#6cf');
    }
  }
  cx.fillStyle='#fff';
  for(const s of shots)cx.fillRect(s.x-1,s.y,3,9);
  if(state==='over'){
    cx.fillStyle='rgba(0,0,0,.6)';cx.fillRect(0,200,W,80);
    cx.fillStyle='#f44';cx.font='bold 36px monospace';cx.textAlign='center';
    cx.fillText('GAME OVER',W/2,248);
    cx.fillStyle='#fff';cx.font='15px monospace';
    cx.fillText('SCORE '+score,W/2,272);
  }
}
document.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  if(e.key==='ArrowLeft')keys.ArrowLeft=true;
  if(e.key==='ArrowRight')keys.ArrowRight=true;
  if(e.key===' ')keys.Space=true;
  if(e.key==='Enter'&&state!=='play'){reset();btn.textContent='重开 (Enter)'}
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft')keys.ArrowLeft=false;
  if(e.key==='ArrowRight')keys.ArrowRight=false;
  if(e.key===' ')keys.Space=false;
});
btn.onclick=()=>{if(state!=='play'){reset();btn.textContent='重开 (Enter)'}};
// 触屏
const tp=document.createElement('div');
tp.style.cssText='display:none;position:fixed;bottom:8px;left:0;right:0;text-align:center';
[['←',()=>keys.ArrowLeft=true,()=>keys.ArrowLeft=false],['🔥',()=>{keys.Space=true;setTimeout(()=>keys.Space=false,80)},null],['→',()=>keys.ArrowRight=true,()=>keys.ArrowRight=false]].forEach(([k,dn,up])=>{
  const b=document.createElement('button');
  b.textContent=k;b.style.cssText='width:64px;height:52px;font-size:20px;margin:0 6px;background:#26c';
  b.addEventListener('pointerdown',e=>{e.preventDefault();dn()});
  if(up)b.addEventListener('pointerup',up);
  tp.appendChild(b);
});
document.body.appendChild(tp);
if('ontouchstart' in window)tp.style.display='block';
reset();
function loop(){
  requestAnimationFrame(loop);
  if(state==='play')update();
  draw();
}
loop();
</script>
</body>
</html>
