<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>月华剑士 · THE LAST BLADE</title>
<style>
html,body{margin:0;background:#0c0e14;color:#dce;font-family:"KaiTi","STKaiti",serif;height:100%;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none}
#box{text-align:center}
canvas{border:3px solid #4a6a8a;background:#000;touch-action:none}
#hud{font-size:14px;color:#9bd;margin:6px 0}
#msg{font-size:16px;color:#6cf;height:22px}
#tip{font-size:11px;color:#567;margin-top:4px;max-width:690px}
button{background:#3a5a7a;border:0;color:#fff;font-family:inherit;padding:6px 16px;cursor:pointer;margin-top:4px}
</style>
</head>
<body>
<div id="box">
  <div id="hud">枫 <span id="hp1" style="color:#ff4">██████████</span> 气弹格/力 <span id="md1">力</span>　VS　<span id="md2">力</span> 弹格/力 <span id="hp2" style="color:#c6f">██████████</span> 高岭</div>
  <canvas id="cv" width="640" height="400"></canvas>
  <div id="msg">按 开始 或 Enter</div>
  <button id="btn">开始 (Enter)</button>
  <div id="tip">A/D 移动 · W 跳 · S 蹲 · J 斩 · K 脚 · L 强力斩(蓄力) · I 弹格(受击前0.2s按下→弹反+回气!) · 气满:斩击强化</div>
</div>
<script>
'use strict';
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
const hp1El=document.getElementById('hp1'),hp2El=document.getElementById('hp2'),md1El=document.getElementById('md1'),md2El=document.getElementById('md2'),msgEl=document.getElementById('msg'),btn=document.getElementById('btn');
const W=640,H=400,GY=352;
let actx=null;
function beep(f,d,type,vol){
  try{
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.connect(g);g.connect(actx.destination);
    o.type=type||'square';o.frequency.value=f;g.gain.value=vol||0.035;
    o.start();o.stop(actx.currentTime+d);
  }catch(e){}
}
let p1,p2,fx,frame,state,keys,roundMsg,shake,petals;
const SFX={
  hit(){beep(200,0.1,'sawtooth',0.06)},
  heavy(){beep(130,0.18,'sawtooth',0.08)},
  block(){beep(740,0.05,'square',0.03)},
  parry(){beep(1600,0.15,'sine',0.08)},
  slash(){beep(1300,0.1,'sawtooth',0.05)},
  ko(){beep(75,0.9,'sawtooth',0.1)}
};
function reset(){
  p1=mk('kaede',130,1);
  p2=mk('takane',410,-1);p2.ai=true;
  fx=[];frame=0;shake=0;keys={};
  petals=Array.from({length:26},()=>({x:Math.random()*W,y:Math.random()*H,s:0.5+Math.random()*1.3,r:Math.random()*6.28}));
  roundMsg='月下の剣';
  setTimeout(()=>{if(roundMsg==='月下の剣')roundMsg=''},1200);
  state='play';upd();
}
function mk(who,x,dir){
  return{who,x,y:GY,vy:0,dir,hp:100,maxhp:100,ki:50,onG:true,crouch:false,
    atkT:0,atkKind:null,hitDone:false,hurtT:0,invT:0,parryT:0,parryFlash:0,
    aiT:0,aiMove:0,aiBlock:false};
}
function upd(){
  const s1=Math.ceil(p1.hp/p1.maxhp*10),s2=Math.ceil(p2.hp/p2.maxhp*10);
  hp1El.textContent='█'.repeat(Math.max(0,s1))+'░'.repeat(10-s1);
  hp2El.textContent='█'.repeat(Math.max(0,s2))+'░'.repeat(10-s2);
  md1El.textContent=p1.ki>=100?'気満':p1.ki+'/100';
  md2El.textContent=p2.ki>=100?'気満':p2.ki+'/100';
}
function gameOver(win1){
  state='over';
  roundMsg=(win1?'楓':'高嶺')+' の勝ち';
  SFX.ko();
  btn.textContent='再来一局 (Enter)';
}
function startAtk(f,kind){
  if(f.atkT>0||f.hurtT>0)return;
  f.atkKind=kind;f.hitDone=false;
  f.atkT=kind==='power'?30:kind==='kick'?16:18;
  const boost=f.ki>=100;
  if(boost&&kind!=='kick'){f.ki=Math.max(0,f.ki-40);upd()}
  if(kind==='power'){SFX.heavy();shake=5}
}
function tryHit(f,foe,dmg,reach,kind){
  if(f.hitDone)return;
  const dx=(foe.x-f.x)*f.dir;
  if(dx>-14&&dx<reach&&Math.abs(foe.y-f.y)<52){
    // 弹格判定
    if(foe.parryT>0&&foe.onG){
      // 弹反成功!
      SFX.parry();
      fx.push({kind:'parry',x:foe.x+f.dir*16,y:foe.y-36,t:20});
      foe.ki=Math.min(100,foe.ki+30);
      f.hurtT=26; // 出招硬直
      f.hitDone=true;
      shake=6;
      upd();
      return;
    }
    const foeBlocking=foe.onG&&foe.hurtT<=0&&(foe.dir===-f.dir)&&
      ((foe===p1&&(keys.a||foe.crouch))||(foe===p2&&(foe.aiBlock||foe.crouch)));
    if(foeBlocking){
      foe.hp-=dmg*0.13;SFX.block();foe.hurtT=7;
      foe.ki=Math.min(100,foe.ki+8);
    }else{
      const boost=f.ki>=100?1.3:1;
      foe.hp-=dmg*boost;
      foe.hurtT=kind==='power'?28:17;
      foe.x+=f.dir*(kind==='power'?9:5);
      SFX.hit();
      fx.push({kind:'hit',x:foe.x,y:foe.y-34,t:13,big:dmg>12||boost>1});
      if(boost>1){fx.push({kind:'slash',x:foe.x,y:foe.y-34,t:12,big:true})}
      shake=dmg>12?8:4;
    }
    f.hitDone=true;upd();
  }
}
function update(){
  frame++;
  if(shake>0)shake--;
  // 樱花
  for(const pt of petals){
    pt.y+=pt.s;pt.r+=0.03;pt.x+=Math.sin(pt.r)*0.7;
    if(pt.y>H){pt.y=-10;pt.x=Math.random()*W}
  }
  const f1=p1,f2=p2;
  if(f1.onG&&f1.atkT<=0&&f1.hurtT<=0)f1.dir=f2.x>f1.x?1:-1;
  if(f2.onG&&f2.atkT<=0&&f2.hurtT<=0)f2.dir=f1.x>f2.x?1:-1;
  if(f1.hurtT<=0){
    f1.crouch=keys.s&&f1.onG;
    const spd=f1.crouch?0:2.5;
    if(keys.a&&f1.atkT<=0)f1.x-=spd;
    if(keys.d&&f1.atkT<=0)f1.x+=spd;
    if(keys.w&&f1.onG&&f1.atkT<=0){f1.vy=-11;f1.onG=false}
    if(keys.i&&f1.onG&&f1.parryT<=0){f1.parryT=12;keys.i=false;
      beep(900,0.05,'sine',0.02)}
    if(keys.j&&f1.atkT<=0){startAtk(f1,'slash');keys.j=false}
    if(keys.k&&f1.atkT<=0){startAtk(f1,'kick');keys.k=false}
    if(keys.l&&f1.atkT<=0){startAtk(f1,'power');keys.l=false}
  }
  // AI
  if(f2.ai&&f2.hurtT<=0){
    f2.aiT--;
    const dx=f1.x-f2.x,ad=Math.abs(dx);
    if(f2.aiT<=0){
      f2.aiT=20+Math.random()*26;
      f2.aiBlock=Math.random()<0.3;
      const r=Math.random();
      if(ad>160)f2.aiMove=dx>0?1:-1;
      else if(ad<75)f2.aiMove=r<0.5?-1:0;
      else f2.aiMove=r<0.45?(dx>0?1:-1):0;
      if(r>0.8&&ad<90)startAtk(f2,'slash');
      else if(r>0.72&&ad<95)startAtk(f2,'power');
      else if(r>0.66&&ad<100)startAtk(f2,'kick');
      if(r>0.5&&r<0.62)f2.parryT=12; // AI也会弹格
    }
    if(f2.aiMove===1)f2.x+=2.1;
    else if(f2.aiMove===-1)f2.x-=2.1;
  }
  for(const f of[f1,f2]){
    if(!f.onG){f.vy+=0.55;f.y+=f.vy;if(f.y>=GY){f.y=GY;f.onG=true}}
    if(f.parryT>0)f.parryT--;
    if(f.parryFlash>0)f.parryFlash--;
    if(f.atkT>0){
      f.atkT--;
      const k=f.atkKind;
      const win={slash:[3,8],kick:[2,7],power:[7,13]}[k];
      if(win&&!f.hitDone&&f.atkT<=win[1]&&f.atkT>=win[0]){
        tryHit(f,f===f1?f2:f1,{slash:11,kick:8,power:24}[k],
          k==='power'?46:34,k);
      }
      if(f.atkT===0)f.atkKind=null;
    }
    if(f.hurtT>0)f.hurtT--;
    if(frame%24===0)f.ki=Math.min(100,f.ki+2);
  }
  if(frame%24===0)upd();
  const ov=54-Math.abs(f1.x-f2.x);
  if(ov>0){const s=Math.sign(f1.x-f2.x)||1;
    f1.x+=s*ov*0.25;f2.x-=s*ov*0.25}
  f1.x=Math.max(30,Math.min(W-30,f1.x));
  f2.x=Math.max(30,Math.min(W-30,f2.x));
  if(p1.hp<=0||p2.hp<=0){
    p1.hp=Math.max(0,p1.hp);p2.hp=Math.max(0,p2.hp);
    gameOver(p2.hp<=0);
  }
  for(const e of fx)e.t--;
  fx=fx.filter(e=>e.t>0);
}
function draw(){
  if(shake>0)cx.save(),cx.translate((Math.random()-0.5)*6,(Math.random()-0.5)*6);
  // 月夜庭院
  const g=cx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a0e24');g.addColorStop(0.6,'#1a2444');g.addColorStop(1,'#2a3654');
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  // 明月
  cx.fillStyle='#e8ecf8';
  cx.beginPath();cx.arc(150,80,40,0,7);cx.fill();
  cx.fillStyle='#c8d0e8';
  cx.beginPath();cx.arc(140,72,8,0,7);cx.fill();
  cx.beginPath();cx.arc(162,88,5,0,7);cx.fill();
  // 樱树
  cx.fillStyle='#141828';
  cx.fillRect(430,140,14,212);
  cx.beginPath();cx.arc(437,120,55,0,7);cx.fill();
  cx.beginPath();cx.arc(470,100,38,0,7);cx.fill();
  cx.fillStyle='#3a4468';
  for(let i=0;i<14;i++){
    const a=i*2.2;
    cx.fillRect(400+(i*37)%120,80+(i*23)%70,4,4);
  }
  // 石灯笼
  cx.fillStyle='#26304a';
  cx.fillRect(560,300,22,52);cx.fillRect(555,290,32,12);
  cx.fillStyle='#f8e8a0';
  cx.fillRect(565,306,12,10);
  // 地面石板
  cx.fillStyle='#3a4258';cx.fillRect(0,GY,W,H-GY);
  cx.fillStyle='#323a50';cx.fillRect(0,GY,W,5);
  cx.strokeStyle='rgba(10,14,30,.6)';
  for(let x=0;x<W;x+=70){cx.beginPath();cx.moveTo(x,GY);cx.lineTo(x,H);cx.stroke()}
  // 樱花
  for(const pt of petals){
    cx.save();cx.translate(pt.x,pt.y);cx.rotate(pt.r);
    cx.fillStyle='rgba(248,200,216,.85)';
    cx.beginPath();cx.ellipse(0,0,4,2.2,0,0,7);cx.fill();
    cx.restore();
  }
  drawFighter(p1,'#e8c8a8','#2a3a5a',true);
  drawFighter(p2,'#e8d8e8','#4a2a4a',false);
  // 特效
  for(const e of fx){
    if(e.kind==='parry'){
      // 弹格闪光
      cx.strokeStyle='rgba(160,240,255,'+(e.t/20)+')';
      cx.lineWidth=4;
      cx.beginPath();cx.arc(e.x,e.y,26+(20-e.t)*1.5,0,7);cx.stroke();
      cx.lineWidth=2;
      cx.beginPath();cx.arc(e.x,e.y,40+(20-e.t)*2,0,7);cx.stroke();
      cx.lineWidth=1;
      cx.fillStyle='rgba(255,255,255,'+(e.t/20)+')';
      cx.font='bold 16px serif';
      cx.fillText('弾',e.x-8,e.y-30);
    }
    if(e.kind==='slash'){
      cx.strokeStyle='rgba(220,240,255,'+(e.t/12)+')';
      cx.lineWidth=e.big?5:3;
      cx.beginPath();cx.arc(e.x,e.y,e.big?40:28,-2.4,-0.6);
      cx.stroke();cx.lineWidth=1;
    }
    if(e.kind==='hit'){
      cx.fillStyle='rgba(255,244,190,'+(e.t/13)+')';
      cx.beginPath();cx.arc(e.x,e.y,e.big?17:10,0,7);cx.fill();
    }
  }
  const drawBar=(x,w,hp,maxhp,col)=>{
    cx.fillStyle='#102';cx.fillRect(x,26,w,16);
    cx.fillStyle=col;cx.fillRect(x,26,w*Math.max(0,hp)/maxhp,16);
    cx.strokeStyle='#000';cx.strokeRect(x,26,w,16);
  };
  drawBar(30,250,p1.hp,p1.maxhp,'#4f4');
  drawBar(W-280,250,p2.hp,p2.maxhp,'#a6f');
  // 气条
  const drawKi=(x,w,ki)=>{
    cx.fillStyle='#102030';cx.fillRect(x,48,w,7);
    cx.fillStyle=ki>=100?'#6ef':(Math.sin(frame*0.15)>0?'#4ae':'#289');
    cx.fillRect(x,48,w*Math.min(100,ki)/100,7);
    if(ki>=100){cx.fillStyle='#cff';cx.font='bold 10px serif';cx.fillText('気',x+w/2-6,55)}
  };
  drawKi(30,250,p1.ki);
  drawKi(W-280,250,p2.ki);
  cx.fillStyle='#fff';cx.font='bold 13px serif';cx.textAlign='left';
  cx.fillText('楓',30,22);
  cx.textAlign='right';cx.fillText('高嶺',W-30,22);
  if(roundMsg){
    cx.fillStyle='rgba(0,0,10,.5)';cx.fillRect(0,168,W,64);
    cx.fillStyle='#8cf';cx.font='bold 30px serif';
    cx.fillText(roundMsg,W/2,208);
  }
  if(shake>0)cx.restore();
}
function drawFighter(f,skin,cloth,isKaede){
  const sx=f.x,sy=f.y;
  cx.fillStyle='rgba(0,0,0,.3)';
  cx.beginPath();cx.ellipse(f.x,GY+4,17,4,0,0,7);cx.fill();
  if(f.hurtT>0&&f.hurtT%4<2)cx.globalAlpha=0.6;
  if(f.parryT>0){ // 弹格姿态提示
    cx.strokeStyle='rgba(140,220,255,.7)';
    cx.lineWidth=2;
    cx.beginPath();cx.arc(sx,sy-30,24,0,7);cx.stroke();
    cx.lineWidth=1;
  }
  const h=f.crouch?0.72:1;
  cx.save();cx.translate(sx,sy);cx.scale(f.dir,1);
  cx.fillStyle='#1a1822';
  cx.fillRect(-7,-13*h,6,13*h);cx.fillRect(1,-13*h,6,13*h);
  cx.fillStyle=cloth;
  cx.fillRect(-9,-44*h,18,22*h);
  cx.fillStyle=isKaede?'#c8c8d8':'#8a8aa8';
  cx.fillRect(-9,-44*h,18,6*h); // 和服领
  cx.fillStyle=skin;
  cx.beginPath();cx.arc(2,-50*h,7,0,7);cx.fill();
  cx.fillStyle=isKaede?'#2a2a3a':'#d8d8e8';
  cx.fillRect(-5,-57*h,13,5);
  // 长发
  if(!isKaede){
    cx.fillStyle='#d8d8e8';
    cx.fillRect(-8,-56*h,4,18*h);
  }
  // 刀
  cx.save();
  if(f.atkT>0){
    const k=f.atkKind;
    const prog=1-f.atkT/(k==='power'?30:18);
    cx.rotate(-1.3+prog*2.6);
    cx.fillStyle='#e0e4f0';
    cx.fillRect(4,-3,48,4.5);
    cx.fillStyle='#4a3a2a';
    cx.fillRect(-8,-2.5,12,4);
  }else{
    cx.rotate(0.35);
    cx.fillStyle='#4a3a2a';
    cx.fillRect(2,-2,12,4);
  }
  cx.restore();
  cx.restore();
  cx.globalAlpha=1;
}
const KM={a:'a',d:'d',w:'w',s:'s',j:'j',k:'k',l:'l',i:'i'};
document.addEventListener('keydown',e=>{
  if(['a','d','w','s','j','k','l','i',' '].includes(e.key))e.preventDefault();
  const k=e.key.toLowerCase();
  if(KM[k])keys[k]=true;
  if(e.key==='Enter'&&state!=='play'){reset();btn.textContent='重开 (Enter)'}
});
document.addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(KM[k])keys[k]=false;
});
btn.onclick=()=>{if(state!=='play'){reset();btn.textContent='重开 (Enter)'}};
if('ontouchstart' in window){
  const tp=document.createElement('div');
  tp.style.cssText='position:fixed;bottom:8px;left:0;right:0;text-align:center';
  [['◀',()=>keys.a=true,()=>keys.a=false],['▶',()=>keys.d=true,()=>keys.d=false],['跳',()=>keys.w=true,()=>keys.w=false],['弾',()=>keys.i=true,()=>keys.i=false],['斬',()=>keys.j=true,()=>keys.j=false],['脚',()=>keys.k=true,()=>keys.k=false],['強',()=>keys.l=true,()=>keys.l=false]].forEach(([k,dn,up])=>{
    const b=document.createElement('button');
    b.textContent=k;b.style.cssText='width:44px;height:46px;font-size:13px;margin:0 2px;background:#3a5a7a';
    b.addEventListener('pointerdown',e=>{e.preventDefault();dn()});
    if(up)b.addEventListener('pointerup',up);
    tp.appendChild(b);
  });
  document.body.appendChild(tp);
}
reset();
function loop(){requestAnimationFrame(loop);if(state==='play')update();draw()}
loop();
</script>
</body>
</html>
