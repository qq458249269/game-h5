<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>吃豆人 · PAC-MAN</title>
<style>
html,body{margin:0;background:#000;color:#fff;height:100%;display:flex;align-items:center;justify-content:center;font-family:monospace;touch-action:none;user-select:none}
#box{text-align:center}
canvas{border:2px solid #2121de;background:#000;touch-action:none}
#hud{font-size:14px;color:#ff0;margin:6px 0}
#msg{font-size:16px;color:#ff0;height:20px}
#tip{font-size:11px;color:#666;margin-top:6px}
button{background:#2121de;color:#fff;border:0;padding:6px 16px;font-size:13px;cursor:pointer;margin-top:4px}
</style></head><body>
<div id="box"><div id="hud">SCORE <span id="sc">0</span>　HI <span id="hi">0</span>　❤<span id="lv">3</span></div>
<canvas id="cv" width="448" height="496"></canvas>
<div id="msg">READY!</div>
<button id="btn">开始 (Enter)</button>
<div id="tip">方向键/WASD 移动 · 吃光豆子过关 · 大豆子可反杀幽灵</div></div>
<script>
const T=16,COLS=28,ROWS=28,cv=document.getElementById('cv'),cx=cv.getContext('2d');
// 0空 1墙 2豆 3能量豆 4鬼屋门
const RAW=[
'1111111111111111111111111111',
'1222222222222112222222222221',
'1211112111112112111112111121',
'1311112111112112111112111131',
'1211112111112112111112111121',
'1222222222222222222222222221',
'1211112112111111112112111121',
'1211112112111111112112111121',
'1222222112222112222112222221',
'1111112111110110111112111111',
'0000012111110110111112100000',
'0000012110000000000112100000',
'0000012110111441110112100000',
'1111112110100000010112111111',
'0000002000100000010002000000',
'1111112110100000010112111111',
'0000012110111111110112100000',
'0000012110000000000112100000',
'0000012110111111110112100000',
'1111112110111111110112111111',
'1222222222222112222222222221',
'1211112111112112111112111121',
'1211112111112112111112111121',
'1322211222222002222221 22231'.replace(' ','2'),
'1112112112111111112112112111',
'1112112112111111112112112111',
'1222222112222002222112222221',
'1111111111111111111111111111'];
// 修正第23行（索引23）中间被切开的通道
RAW[23]='1322211222222002222221222231';
let map,dots,pac,pacDir,wantDir,ghosts,score,lives,mode,modeT,mouth,ready,over,ghostEat,hiscore=+(localStorage.getItem('pac_hi')||0);
const DIRS={0:[0,0],1:[-1,0],2:[0,-1],3:[1,0],4:[0,1]}; // l u r d
const OPP={1:3,2:4,3:1,4:2};
document.getElementById('hi').textContent=hiscore;
function resetMap(){map=RAW.map(r=>r.split('').map(Number));dots=0;
 for(const row of map)for(const v of row)if(v===2||v===3)dots++}
function mkGhosts(){return[
 {x:13.5,y:11,c:'#ff0000',d:2,home:[13.5,11],name:'blinky'},
 {x:11.5,y:14,c:'#ffb8ff',d:4,home:[11.5,14],name:'pinky'},
 {x:13.5,y:14,c:'#00ffff',d:2,home:[13.5,14],name:'inky'},
 {x:15.5,y:14,c:'#ffb852',d:4,home:[15.5,14],name:'clyde'}].map(g=>({...g,fright:0,eaten:false}))}
function newLevel(){resetMap();pac={x:13.5,y:23};pacDir=1;wantDir=1;ghosts=mkGhosts();mode=0;modeT=0;ghostEat=0;ready=90}
function newGame(){score=0;lives=3;over=false;newLevel();upd()}
function upd(){document.getElementById('sc').textContent=score;document.getElementById('lv').textContent=lives}
function tile(x,y){if(y<0||y>=ROWS)return 1;const xx=((x%COLS)+COLS)%COLS;return map[y][xx]}
function wallAt(x,y){const v=tile(x,y);return v===1||v===4}
function canGo(x,y,d){const[dx,dy]=DIRS[d];return !wallAt(Math.floor(x+dx*0.6),Math.floor(y+dy*0.6))}
function moveEnt(e,d,sp){const[dx,dy]=DIRS[d];e.x+=dx*sp;e.y+=dy*sp;
 if(e.x<-0.5)e.x=COLS-0.5;if(e.x>COLS+0.5-1)e.x=-0.5+1-1; // 隧道环绕
 if(e.x<0)e.x+=COLS;if(e.x>=COLS)e.x-=COLS;
 // 对齐中心线
 if(dx===0)e.x=Math.round(e.x*2)/2;
 if(dy===0)e.y=Math.round(e.y*2)/2}
function atCenter(e){return Math.abs(e.x-Math.round(e.x))<0.08&&Math.abs(e.y-Math.round(e.y))<0.08}
function ghostTarget(g){
 if(g.fright>0)return[Math.random()*COLS|0,Math.random()*ROWS|0];
 const[dx,dy]=DIRS[pacDir];
 switch(g.name){
 case'blinky':return[pac.x,pac.y];
 case'pinky':return[pac.x+dx*4,pac.y+dy*4];
 case'inky':return[pac.x-dx*4,pac.y-dy*4];
 case'clyde':return Math.hypot(g.x-pac.x,g.y-pac.y)>8?[pac.x,pac.y]:[0,ROWS-1]}}
function update(){
 if(ready>0){ready--;return}
 // 模式切换 scatter/chase
 modeT++;if(modeT>=(mode? 1200:420)){mode=1-mode;modeT=0;ghosts.forEach(g=>{if(!g.fright)g.d=OPP[g.d]})}
 if(pacDir===0)pacDir=wantDir;
 if(canGo(pac.x,pac.y,wantDir)||!wallAt(pac.x+DIRS[wantDir][0]*0.9,pac.y+DIRS[wantDir][1]*0.9)&&Math.abs(pac.x-Math.round(pac.x))<0.5&&Math.abs(pac.y-Math.round(pac.y))<0.5)pacDir=wantDir;
 if(!canGo(pac.x,pac.y,pacDir)){if(atCenter(pac))pacDir=0}
 if(pacDir)moveEnt(pac,pacDir,0.13);
 // 吃豆
 const tx=Math.round(pac.x),ty=Math.round(pac.y);
 if(ty>=0&&ty<ROWS&&tx>=0&&tx<COLS){const v=map[ty][tx];
 if(v===2){map[ty][tx]=0;dots--;score+=10;upd()}
 if(v===3){map[ty][tx]=0;dots--;score+=50;upd();ghosts.forEach(g=>g.fright=480);ghostEat=0}
 if(dots<=0){msg('关卡完成!');ready=120;setTimeout(()=>{if(!over)newLevel()},1500);return}}
 // 幽灵
 for(const g of ghosts){
 const sp=g.fright>0?0.09:(g.eaten?0.24:0.11);
 if(g.fright>0)g.fright--;
 if(g.eaten){ // 回巢
 const hx=g.home[0],hy=g.home[1];
 if(Math.abs(g.x-hx)<0.15&&Math.abs(g.y-hy)<0.15){g.eaten=false;g.fright=0}
 else{const ddx=hx-g.x,ddy=hy-g.y,L=Math.hypot(ddx,ddy);g.x+=ddx/L*sp;g.y+=ddy/L*sp}
 }else if(atCenter(g)){
 g.x=Math.round(g.x);g.y=Math.round(g.y);
 const opts=[1,2,3,4].filter(d=>d!==OPP[g.d]&&!wallAt(g.x+DIRS[d][0],g.y+DIRS[d][1]));
 const target=ghostTarget(g);let best;
 if(opts.length){best=opts.reduce((a,b)=>{const[ax,ay]=DIRS[a],[bx,by]=DIRS[b];
 const da=(ax*g.x+ax*0- target[0])**2+(ay+g.y- target[1])**2, db=(bx+g.x-target[0])**2+(by+g.y-target[1])**2;
 return da<=db?a:b})}
 else best=OPP[g.d];
 g.d=best;moveEnt(g,g.d,sp)}
 else moveEnt(g,g.d,sp);
 // 碰撞
 if(Math.hypot(g.x-pac.x,g.y-pac.y)<0.7&&!g.eaten){
 if(g.fright>0){g.eaten=true;score+=200*(++ghostEat);upd()}
 else{lives--;upd();msg('被抓住了!');ready=100;
 if(lives<=0){over=true;msg('GAME OVER');saveHi();btn.textContent='再来一局 (Enter)'}
 else setTimeout(()=>{if(!over){pac={x:13.5,y:23};pacDir=1;wantDir=1;ghosts=mkGhosts();msg('READY!');ready=80}},10)}
 return}}}
function saveHi(){if(score>hiscore){hiscore=score;localStorage.setItem('pac_hi',hiscore);document.getElementById('hi').textContent=hiscore}}
const msgEl=document.getElementById('msg');function msg(s){msgEl.textContent=s}
function drawGhost(g){
 const X=g.x*T+T/2,Y=g.y*T+T/2;
 cx.fillStyle=g.fright>0?(g.fright<120&&g.fright%20<10?'#fff':'#2121de'):(g.eaten?'#ddd':g.c);
 cx.beginPath();cx.arc(X,Y-2,6.5,Math.PI,0);
 cx.lineTo(X+6.5,Y+5);
 for(let i=0;i<3;i++)cx.lineTo(X+6.5-((i*2+1)*2.2),Y+(i%2?5:8));
 cx.lineTo(X-6.5,Y+5);cx.closePath();cx.fill();
 if(!g.eaten){cx.fillStyle='#fff';if(g.fright>0)cx.fillStyle=g.fright<120?'#f00':'#fff';
 cx.fillRect(X-4,Y-3,3,4);cx.fillRect(X+1,Y-3,3,4);
 cx.fillStyle='#00f';cx.fillRect(X-3+(g.fright>0?0:0),Y-2,2,2);cx.fillRect(X+2,Y-2,2,2)}}
function draw(){
 cx.fillStyle='#000';cx.fillRect(0,0,cv.width,cv.height);
 // 迷宫
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const v=map[y][x];
 if(v===1){cx.fillStyle='#2121de';cx.fillRect(x*T+6,y*T+6,T-12,T-12);
 cx.fillStyle='#0000aa';cx.fillRect(x*T+6,y*T+6,T-12,2)}
 if(v===2){cx.fillStyle='#ffb897';cx.fillRect(x*T+6,y*T+6,4,4)}
 if(v===3){cx.fillStyle='#ffb897';cx.beginPath();cx.arc(x*T+8,y*T+8,5,0,7);cx.fill()}}
 // 门
 // 吃豆人
 if(pac){const X=pac.x*T+T/2,Y=pac.y*T+T/2;
 mouth=(mouth||0)+0.2;const open=pacDir?Math.abs(Math.sin(mouth))*0.9:0;
 cx.fillStyle='#ff0';cx.beginPath();
 const ang={0:0,1:Math.PI,2:-Math.PI/2,3:0,4:Math.PI/2}[pacDir]||0;
 cx.moveTo(X,Y);cx.arc(X,Y,7,ang+open,ang-open+Math.PI*2);cx.closePath();cx.fill()}
 ghosts.forEach(drawGhost);
 if(ready>0&&dots===0){} }
const btn=document.getElementById('btn');
btn.onclick=()=>{newGame();msg('READY!');btn.textContent='重开 (Enter)'};
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();
 if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())||['w','a','s','d'].includes(k))e.preventDefault();
 const M={arrowleft:1,a:1,arrowup:2,w:2,arrowright:3,d:3,arrowdown:4,s:4};
 if(M[k]!==undefined){wantDir=M[k];if(pacDir===0)pacDir=M[k]}
 if(e.key==='Enter'){if(over||!pac)newGame();btn.onclick()}});
// 触屏滑动
let sx,sy;cv.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY});
cv.addEventListener('touchmove',e=>{e.preventDefault();const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
 if(Math.abs(dx)>20||Math.abs(dy)>20){wantDir=Math.abs(dx)>Math.abs(dy)?(dx>0?3:1):(dy>0?4:2);sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:false});
function loop(){update();draw();requestAnimationFrame(loop)}
resetMap();pac={x:13.5,y:23};ghosts=mkGhosts();ready=1e9;btn.textContent='开始 (Enter)';loop();
</script></body></html>
